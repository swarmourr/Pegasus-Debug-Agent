[build-system]
requires = ["setuptools>61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus-healer"
version = "0.1.0"
description = "Agentic failure diagnosis and remediation for Pegasus WMS"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Pegasus Team", email = "pegasus@isi.edu" },
]
keywords = ["pegasus", "workflow", "htcondor", "remediation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    # ── Pydantic / settings ────────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── LangGraph (SQLite checkpoint — no Postgres required) ───────────────
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",

    # ── LLM — any provider via LiteLLM, structured output via Instructor ───
    "litellm>=1.40.0",
    "instructor>=1.3.0",

    # ── Logging / observability ────────────────────────────────────────────
    "structlog>=24.0.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",

    # ── Config / utilities ─────────────────────────────────────────────────
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
pegasus-healer = "Pegasus.healer.cli.healer:main"

[project.urls]
Homepage = "https://pegasus.isi.edu"
Repository = "https://github.com/pegasus-isi/pegasus"
Issues = "https://github.com/pegasus-isi/pegasus/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (lint + format) ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "UP", "B", "SIM"]
ignore = ["F403", "F405"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::ResourceWarning"]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["Pegasus.healer"]
omit = ["test/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
